name: Daily tennis pipeline

on:
  workflow_dispatch:             # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: daily-pipeline          # never run two copies at once
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # kill a hung run after 20 min instead of letting it go on for hours
    steps:
      - uses: actions/checkout@v5   # clones repo to virtual machine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"           # reuses downloaded packages between runs, so installs are faster

      - run: pip install -r requirements.txt

      - name: Run data pipeline
        run: python Scripts/pipeline.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY}}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY}}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY}}

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Data/
          git diff --staged --quiet && exit 0
          git commit -m "Daily data update $(date -u +%F)"
          git status --short
          git pull --rebase --autostash -X theirs
          git push